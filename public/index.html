<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>朋友德州扑克</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#0b3d2e;color:#fff}
#join{max-width:360px;margin:60px auto;padding:20px;text-align:center}
#join input{width:100%;padding:12px;margin:8px 0;font-size:17px;border-radius:10px;border:0}
button{font-size:16px;padding:11px 14px;border-radius:10px;border:0;margin:3px;background:#f2c94c;color:#222;font-weight:600}
button.gray{background:#ddd}button.red{background:#eb5757;color:#fff}button:disabled{opacity:.4}
#game{display:none;max-width:520px;margin:0 auto;padding:8px}
.top{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.board{background:#13694b;border-radius:80px;padding:18px 8px;text-align:center;margin:10px 0}
.pot{font-size:15px;margin-bottom:6px}
.card{display:inline-block;width:38px;height:54px;line-height:54px;background:#fff;color:#111;border-radius:6px;margin:2px;font-weight:700;font-size:17px}
.card.r{color:#d0021b}.card.back{background:repeating-linear-gradient(45deg,#2d6cdf,#2d6cdf 4px,#1f4fa8 4px,#1f4fa8 8px)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seat{background:rgba(0,0,0,.25);border-radius:10px;padding:7px;font-size:13px;min-height:84px}
.seat.turn{outline:3px solid #f2c94c}.seat.fold{opacity:.45}.seat.me{background:rgba(242,201,76,.18)}
.seat .card{width:28px;height:40px;line-height:40px;font-size:13px}
.act{position:sticky;bottom:0;background:#0b3d2e;padding:8px 0}
#raise{width:100%}#log{font-size:12px;opacity:.8;max-height:140px;overflow:auto;margin-top:8px}
#msg{color:#ffb3b3;min-height:18px;font-size:13px}
</style></head><body>
<div id="join"><h2>朋友德州扑克</h2><p style="font-size:13px;opacity:.8">只用筹码，不涉及真钱。大家输入同一个房间号就进同一桌，最多 6 人。</p>
<input id="name" placeholder="你的昵称"><input id="roomIn" placeholder="房间号，比如 888">
<button onclick="join()" style="width:100%">进入牌桌</button></div>
<div id="game">
 <div class="top"><span id="roomInfo"></span><span><button class="gray" style="padding:5px 9px;font-size:13px" onclick="share()">复制邀请链接</button></span></div>
 <div class="board"><div class="pot" id="pot"></div><div id="boardCards"></div><div id="result" style="font-size:13px;margin-top:6px"></div></div>
 <div class="seats" id="seats"></div>
 <div id="msg"></div>
 <div class="act" id="act"></div>
 <div id="log"></div>
</div>
<script>
const q=new URLSearchParams(location.search);let token=localStorage.pokerToken||(localStorage.pokerToken=Math.random().toString(36).slice(2)+Date.now());
document.getElementById('name').value=localStorage.pokerName||'';document.getElementById('roomIn').value=q.get('room')||'';
let ws,S,roomId;
function join(){const n=document.getElementById('name').value.trim(),r=document.getElementById('roomIn').value.trim();if(!n||!r)return alert('请填写昵称和房间号');
 localStorage.pokerName=n;roomId=r;history.replaceState(null,'','?room='+encodeURIComponent(r));connect();}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>send({type:'join',room:roomId,name:localStorage.pokerName,token});
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error'){msg(m.msg);return}S=m;if(S.hand)S.hand.deadline=Date.now()+S.hand.left;render()};
 ws.onclose=()=>{msg('连接断开，正在重连…');setTimeout(connect,2000)};
 document.getElementById('join').style.display='none';document.getElementById('game').style.display='block';}
function send(o){ws&&ws.readyState===1&&ws.send(JSON.stringify(o))}
function msg(t){const el=document.getElementById('msg');el.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>el.textContent='',4000)}
function share(){const u=location.origin+'/?room='+encodeURIComponent(roomId);navigator.clipboard?.writeText(u).then(()=>msg('已复制：'+u),()=>prompt('复制这个链接发给朋友',u))}
const SU={s:'♠',h:'♥',d:'♦',c:'♣'};
function card(c){if(c==='??')return '<span class="card back"></span>';const r=c[0]==='T'?'10':c[0];return `<span class="card ${'hd'.includes(c[1])?'r':''}">${r}${SU[c[1]]}</span>`}
const ST={preflop:'翻牌前',flop:'翻牌',turn:'转牌',river:'河牌'};
function render(){const h=S.hand,me=S.seats[S.me];
 document.getElementById('roomInfo').textContent=`房间 ${S.room} · 盲注 ${S.sb}/${S.bb}`+(S.handNo?` · 第 ${S.handNo} 手`:'');
 document.getElementById('pot').textContent=h?`底池 ${h.pot} · ${h.done?'本手结束':ST[h.street]}`:'等待开始';
 document.getElementById('boardCards').innerHTML=h?h.board.map(card).join(''):'';
 document.getElementById('result').innerHTML=h&&h.showdown?h.showdown.results.map(x=>`${x.winners.join('、')} 赢 ${x.amt}（${x.desc}）`).join('<br>'):'';
 document.getElementById('seats').innerHTML=S.seats.map((p,i)=>{if(!p)return `<div class="seat" style="opacity:.3">空座</div>`;
  const tags=[i===S.dealer&&h?'庄':'',i===S.host?'房主':'',p.online?'':'离线',p.away?'暂离':'',p.allIn?'全下':''].filter(Boolean).join(' ');
  const sd=h&&h.showdown&&h.showdown.hands[i]?`<div>${h.showdown.hands[i]}</div>`:'';
  return `<div class="seat ${h&&h.toAct===i?'turn':''} ${p.folded?'fold':''} ${i===S.me?'me':''}"><b>${esc(p.name)}</b> ${tags}<br>筹码 ${p.chips}${p.buyins>1?`（补码${p.buyins-1}次）`:''}${p.bet?` · 本轮 ${p.bet}`:''}<br>${p.cards?p.cards.map(card).join(''):''} <span style="opacity:.8">${p.lastAction||''}</span>${sd}</div>`}).join('');
 const A=document.getElementById('act');let html='';
 if(h&&!h.done&&h.toAct===S.me&&me){const toCall=h.currentBet-me.bet,minTo=Math.min(h.currentBet+h.minRaise,me.bet+me.chips),maxTo=me.bet+me.chips;
  const left=Math.max(0,Math.ceil((h.deadline-Date.now())/1000));
  html+=`<div style="font-size:13px">轮到你了（${left} 秒内操作）</div><button class="red" onclick="act('fold')">弃牌</button>`;
  html+=toCall>0?`<button onclick="act('call')">跟注 ${Math.min(toCall,me.chips)}</button>`:`<button onclick="act('check')">过牌</button>`;
  if(maxTo>h.currentBet){html+=`<button onclick="act('raise',+document.getElementById('raise').value)">加到 <span id="rv">${minTo}</span></button><button onclick="act('allin')">全下</button>`;
   html+=`<input id="raise" type="range" min="${minTo}" max="${maxTo}" step="${S.bb/2}" value="${minTo}" oninput="document.getElementById('rv').textContent=this.value">`;}
 } else if(!h||h.done){html+=`<button onclick="send({type:'start'})">发下一手</button>`;
  html+=`<button class="gray" onclick="send({type:'rebuy'})">补码 2000</button><button class="gray" onclick="send({type:'away'})">${me&&me.away?'我回来了':'暂离'}</button><button class="gray" onclick="if(confirm('确定离开座位？'))send({type:'leave'})">离座</button>`;
 } else html+=`<div style="font-size:13px;opacity:.8">等待 ${esc(S.seats[h.toAct]?.name||'')} 操作…</div>`;
 A.innerHTML=html;
 document.getElementById('log').innerHTML=S.log.slice().reverse().map(esc).join('<br>');}
function act(a,amount){send({type:'act',action:a,amount})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
setInterval(()=>{if(S&&S.hand&&!S.hand.done&&S.hand.toAct===S.me){const el=document.querySelector('#act div');if(el){const left=Math.max(0,Math.ceil((S.hand.deadline-Date.now())/1000));el.textContent=`轮到你了（${left} 秒内操作）`}}},1000);
if(q.get('room')&&localStorage.pokerName){roomId=q.get('room');connect()}
</script></body></html>
